name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12h
  workflow_dispatch:       # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#20232a&color_dots=#ebedf0,#b6ecfb,#7fdcf5,#3fc3e8,#0e9cc4
            dist/snake-dark.svg?color_snake=#61dafb&color_dots=#161b22,#0b3a4a,#11627a,#2a9bbd,#61dafb

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
